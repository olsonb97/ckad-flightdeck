<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CKAD Flightdeck · Practice</title>
  <link rel="stylesheet" href="/static/vendor/terminal.css">
  <link rel="stylesheet" href="/static/style.css?v=8">
  <link rel="stylesheet" href="/static/enhancements.css?v=8">
  <script type="module" src="/static/app.js?v=8"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <button id="menu-button" class="icon-button menu-button" aria-label="Toggle question bank" aria-controls="sidebar" aria-expanded="true" title="Questions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <a class="brand" href="/" aria-label="Flightdeck home"><span class="brand-mark" aria-hidden="true">⎈</span>Flightdeck <span class="brand-tag">CKAD</span></a>
    </div>
    <nav class="top-actions" aria-label="Workspace controls">
      <button id="settings-button" class="settings-toggle icon-button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4m6 0h6M4 17h10m6 0h0"/><circle cx="11" cy="7" r="3"/><circle cx="17" cy="17" r="3"/></svg></button>
      <button id="mock-button" class="mock-button" disabled>Timed mock</button>
    </nav>
  </header>
  <div id="exam-bar" class="exam-bar hidden" aria-label="Mock exam status"></div>
  <div id="lab-warning" class="lab-warning hidden" role="status" aria-live="polite"></div>
  <div id="operation-bar" class="operation-bar hidden" role="status" aria-live="polite"></div>
  <div class="workspace-layout">
    <button id="sidebar-backdrop" class="sidebar-backdrop" aria-label="Close question bank" tabindex="-1"></button>
    <aside id="sidebar" class="sidebar" aria-label="Question bank">
      <div class="bank-header"><h1>Questions</h1><span id="completed-count" class="bank-count" aria-label="Questions completed">0 / 20</span></div>
      <select id="set-selector" class="set-selector" aria-label="Question set" disabled><option value="core">Set 1 · Core 20</option></select>
      <label class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Search questions" aria-label="Search questions" title="Search questions · /"></label>
      <div id="question-list" class="question-list"></div>
    </aside>
    <main class="main-layout">
      <section class="task-panel" aria-label="Current question">
        <div id="task-content" class="task-content"></div>
        <div class="task-controls">
          <div class="task-control-buttons">
            <button id="prepare-button" class="primary hidden" disabled>Retry question</button>
            <button id="grade-button" class="primary grade-button hidden" disabled>Check work</button>
            <button id="reset-button" class="reset-button icon-button" title="Reset question lab" aria-label="Reset this question's lab" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button>
          </div>
        </div>
      </section>
      <section class="terminal-panel" aria-label="Live terminal">
        <div class="terminal-toolbar">
          <div class="terminal-tabs" role="tablist" aria-label="Shell sessions">
            <button class="terminal-tab active" data-terminal="main" role="tab" id="shell-main-tab" aria-selected="true" aria-controls="terminal-main">Terminal 1</button>
            <button class="terminal-tab" data-terminal="scratch" role="tab" id="shell-scratch-tab" aria-selected="false" aria-controls="terminal-scratch" tabindex="-1">Terminal 2</button>
          </div>
          <div class="terminal-tools">
            <span id="terminal-state" class="terminal-state" title="Connecting"><i id="terminal-dot" aria-hidden="true"></i><span id="terminal-connection" class="sr-only" role="status">Connecting</span></span>
            <button id="terminal-expand" class="icon-button" title="Expand terminal · Esc to exit" aria-label="Expand terminal" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
          </div>
        </div>
        <div class="terminal-stage">
          <div id="terminal-main" class="terminal-host active" role="tabpanel" aria-labelledby="shell-main-tab"></div>
          <div id="terminal-scratch" class="terminal-host" role="tabpanel" aria-labelledby="shell-scratch-tab"></div>
          <div id="terminal-placeholder" class="terminal-placeholder">
            <strong id="terminal-placeholder-title">Connecting…</strong>
            <span id="terminal-placeholder-message"></span>
            <button id="terminal-retry" class="terminal-retry hidden">Reconnect</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
</body>
</html>
